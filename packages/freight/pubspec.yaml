name: freight
description: "Ship large assets outside your app bundle: iOS Managed Background Assets and Google Play Asset Delivery behind one Dart API."
version: 0.1.1
homepage: https://github.com/Treamz/freight
repository: https://github.com/Treamz/freight
issue_tracker: https://github.com/Treamz/freight/issues

topics:
  - assets
  - ios
  - background-assets
  - asset-delivery

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.treamz.freight
        pluginClass: FreightPlugin
      ios:
        pluginClass: FreightPlugin
