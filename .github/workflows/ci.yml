name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Analyze and test freight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/freight
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Publish dry run
        run: |
          set -o pipefail
          if output=$(flutter pub publish --dry-run 2>&1); then
            echo "$output"
            exit 0
          fi
          status=$?
          echo "$output"
          # Before the first release the version carries a -dev suffix and has no
          # CHANGELOG section of its own, which pub reports as a warning and
          # exits 65 for. Releasing removes it. Anything else is a real failure,
          # so only this exact single-warning case is tolerated.
          if echo "$output" | grep -q "Package has 1 warning" &&
            echo "$output" | grep -q "doesn't mention current version"; then
            echo "Tolerated: pre-release version has no CHANGELOG section yet."
            exit 0
          fi
          exit $status

      - name: Score with pana
        run: |
          dart pub global activate pana
          # The threshold is exactly the deduction for a CHANGELOG that does not
          # mention the pubspec's version, which is unavoidable while entries
          # live under "Unreleased". Drop it to 0 after the first release.
          dart pub global run pana --no-warning --exit-code-threshold 5 .

  cli:
    name: Analyze and test freight_cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/freight_cli
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Check it does not depend on the plugin
        run: |
          # The split only pays off while the two stay uncoupled: a dependency
          # here would drag Flutter back into build-time tooling.
          if grep -rq "package:freight/" lib bin test; then
            echo "freight_cli imports freight; the packages must stay independent."
            exit 1
          fi

      - name: Publish dry run
        run: |
          set -o pipefail
          if output=$(dart pub publish --dry-run 2>&1); then
            echo "$output"
            exit 0
          fi
          status=$?
          echo "$output"
          if echo "$output" | grep -q "Package has 1 warning" &&
            echo "$output" | grep -q "doesn't mention current version"; then
            echo "Tolerated: pre-release version has no CHANGELOG section yet."
            exit 0
          fi
          exit $status

      - name: Score with pana
        run: |
          dart pub global activate pana
          # The threshold is exactly the deduction for a CHANGELOG that does not
          # mention the pubspec's version, which is unavoidable while entries
          # live under "Unreleased". Drop it to 0 after the first release.
          dart pub global run pana --no-warning --exit-code-threshold 5 .

  example:
    name: Build example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          # Managed Background Assets is iOS 26. Built against an older SDK the
          # plugin does not compile at all, so fail loudly with the versions that
          # were available rather than with a wall of missing-symbol errors.
          latest=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist" 2>/dev/null) || continue
            echo "found $app -> $version"
            major=${version%%.*}
            if [ "$major" -ge 26 ] 2>/dev/null; then
              latest="$app"
            fi
          done
          if [ -z "$latest" ]; then
            echo "No Xcode 26 or newer on this runner; the example needs the iOS 26 SDK."
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build for the iOS simulator
        working-directory: packages/freight/example
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign

      - name: Generate an extension target into a fresh app and build it
        run: |
          # The strongest check available without a device: freight setup edits
          # project.pbxproj by splicing text, and the only real proof that the
          # result is a valid project is Xcode building it.
          cd "$RUNNER_TEMP"
          flutter create --platforms=ios --org com.example -i swift setup_probe
          cd setup_probe
          dart run "$GITHUB_WORKSPACE/packages/freight_cli/bin/freight.dart" setup

          # Idempotent: a second run must change nothing.
          before=$(shasum ios/Runner.xcodeproj/project.pbxproj | cut -d' ' -f1)
          dart run "$GITHUB_WORKSPACE/packages/freight_cli/bin/freight.dart" setup
          after=$(shasum ios/Runner.xcodeproj/project.pbxproj | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "Running setup twice changed the project."
            exit 1
          fi

          flutter build ios --simulator

          appex="build/ios/iphonesimulator/Runner.app/Extensions/FreightDownloader.appex"
          if [ ! -d "$appex" ]; then
            echo "The extension was not embedded at $appex"
            find build/ios/iphonesimulator/Runner.app -name '*.appex' || true
            exit 1
          fi
          point=$(/usr/libexec/PlistBuddy -c \
            'Print :EXAppExtensionAttributes:EXExtensionPointIdentifier' \
            "$appex/Info.plist")
          if [ "$point" != "com.apple.background-assets.content-request" ]; then
            echo "Wrong extension point: $point"
            exit 1
          fi
          echo "Extension embedded and declaring $point"

  packs:
    name: Package assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          latest=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist" 2>/dev/null) || continue
            major=${version%%.*}
            if [ "$major" -ge 26 ] 2>/dev/null; then
              latest="$app"
            fi
          done
          if [ -z "$latest" ]; then
            echo "No Xcode 26 or newer on this runner; ba-package ships with Xcode 26."
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"

      - uses: dart-lang/setup-dart@v1

      - name: Build the example packs with the real tool
        working-directory: packages/freight_cli
        run: |
          dart pub get
          dart run bin/freight.dart build \
            --config ../freight/example/freight.yaml \
            --output "$GITHUB_WORKSPACE/build/packs" \
            --base-url https://packs.example.invalid/packs

      - name: Check the archives contain the planned logical paths
        run: |
          # The whole design rests on ba-package recording paths relative to the
          # pack root, so this asserts the archives contain exactly what the
          # manifests declared - and, in particular, that the source layout has
          # not leaked in as a path prefix.
          python3 - <<'CHECK'
          import json, pathlib, subprocess, sys

          failures = []
          manifests = sorted(pathlib.Path("build/packs/manifests").glob("*.json"))
          if not manifests:
              sys.exit("no manifests were generated")

          for manifest in manifests:
              spec = json.loads(manifest.read_text())
              pack = spec["assetPackID"]
              archive = f"build/packs/{pack}.aar"
              listing = subprocess.run(
                  ["aa", "list", "-i", archive],
                  capture_output=True, text=True, check=True,
              ).stdout.split()

              declared = [s["file"] for s in spec["fileSelectors"]]
              for path in declared:
                  if f"Contents/{path}" not in listing:
                      failures.append(f"{pack}: declared {path!r}, not in the archive")

              for entry in listing:
                  if entry.startswith("Contents/") and "." in entry.rsplit("/", 1)[-1]:
                      logical = entry[len("Contents/"):]
                      if logical not in declared:
                          failures.append(f"{pack}: archive has {logical!r}, not declared")

              print(f"{pack}: {len(declared)} paths verified")

          if failures:
              sys.exit("\n".join(failures))
          CHECK

      - name: Check doctor passes on the example
        working-directory: packages/freight/example
        run: dart run ../../freight_cli/bin/freight.dart doctor

  android:
    name: Build example for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the APK
        working-directory: packages/freight/example
        run: |
          # Compiles the Kotlin bridge, which nothing on the Dart or iOS side
          # would catch. Play Asset Delivery cannot be exercised here — that
          # needs a device with Play services and a published app.
          flutter pub get
          flutter build apk --debug

      - name: Stage the packs and check they reach the app bundle
        working-directory: packages/freight/example
        run: |
          # Asset packs only exist in an app bundle, so the APK above proves
          # nothing about them. This builds the bundle and asserts each pack is
          # in it under the same logical paths the iOS archive records.
          dart run ../../freight_cli/bin/freight.dart build --platform android
          flutter build appbundle

          aab=build/app/outputs/bundle/release/app-release.aab
          python3 - "$aab" <<'CHECK'
          import sys, zipfile

          expected = {
              "tutorial": ["nested/deep.txt", "steps.json", "welcome.txt"],
              "maps_europe": ["berlin.tiles", "index.txt", "prague.tiles"],
          }

          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          missing = []
          for pack, files in expected.items():
              for name in files:
                  entry = f"{pack}/assets/{name}"
                  if entry not in names:
                      missing.append(entry)
              print(f"{pack}: {len(files)} paths verified")

          if missing:
              sys.exit("missing from the bundle:\n" + "\n".join(missing))
          CHECK
